# Provider pricing database for agent-lint.
# Prices in USD per 1K tokens.
#
# NOTE: OpenAI and Anthropic do not expose pricing via public API.
# This file is updated manually. When prices change, edit this file
# and bump the last_updated timestamp below.

meta:
  last_updated: "2026-08-17"
  source: "official provider pricing pages; manually maintained"

providers:
  anthropic:
    default_model: claude-sonnet-4
    models:
      claude-opus-4:
        input: 0.015
        output: 0.075
        context: 200000
      claude-sonnet-4:
        input: 0.003
        output: 0.015
        context: 200000
      claude-haiku-3.5:
        input: 0.0008
        output: 0.004
        context: 200000

  openai:
    default_model: gpt-5.6
    models:
      # Standard API rates. Cached-input discounts, cache-write premiums,
      # Batch/Flex rates, and long-context surcharges are not modeled yet.
      gpt-5.6:
        input: 0.005
        output: 0.03
        context: 1050000
        notes: "Alias for gpt-5.6-sol"
      gpt-5.6-sol:
        input: 0.005
        output: 0.03
        context: 1050000
      gpt-5.6-terra:
        input: 0.002
        output: 0.012
        context: 1050000
      gpt-5.6-luna:
        input: 0.0002
        output: 0.0012
        context: 1050000
      gpt-4o:
        input: 0.0025
        output: 0.01
        context: 128000
      gpt-4o-mini:
        input: 0.00015
        output: 0.0006
        context: 128000
      o1:
        input: 0.015
        output: 0.06
        context: 200000

  ollama:
    default_model: llama3.3-70b
    models:
      llama3.3-70b:
        input: 0.0
        output: 0.0
        context: 131072
        notes: "Self-hosted, hardware cost not included"
      deepseek-r1:
        input: 0.0
